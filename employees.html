<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCM Lite - Manage Employees</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar" id="main-nav"></nav>

    <div class="container">
        <div class="card">
            <div class="card-title">
                <span>Employee Directory</span>
                <button class="btn btn-primary" onclick="openModal()">+ Add New Employee</button>
            </div>

            <!-- SEARCH & FILTER -->
            <div style="display:flex; gap:1rem; margin-bottom:1.25rem; flex-wrap:wrap;">
                <input type="text" id="search-input" class="form-control" placeholder="Search by name or email..."
                    style="max-width:300px;">
                <select id="filter-dept" class="form-control" style="max-width:200px;">
                    <option value="">All Departments</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Design">Design</option>
                    <option value="HR">HR</option>
                    <option value="Sales">Sales</option>
                    <option value="Operations">Operations</option>
                </select>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employee-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ADD / EDIT MODAL -->
    <div class="modal-overlay" id="employee-modal">
        <div class="modal">
            <h3 style="margin-bottom:1rem;" id="modal-title">Add Employee</h3>
            <form id="employee-form">
                <input type="hidden" id="emp-id">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="emp-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="emp-email" class="form-control" required>
                    <span class="field-error" id="err-emp-email"></span>
                </div>
                <div class="form-group">
                    <label>Password (for login)</label>
                    <input type="text" id="emp-password" class="form-control" required minlength="4">
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <select id="emp-dept" class="form-control" required>
                        <option value="Engineering">Engineering</option>
                        <option value="Design">Design</option>
                        <option value="HR">HR</option>
                        <option value="Sales">Sales</option>
                        <option value="Operations">Operations</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Monthly Salary (PKR / USD)</label>
                    <input type="number" id="emp-salary" class="form-control" min="1" required>
                    <span class="field-error" id="err-emp-salary"></span>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Employee</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script>
        Auth.checkAccess(["admin"]);
        Auth.renderNavbar("employees");

        let allUsers = Storage.getUsers();

        function renderTable() {
            const q = document.getElementById("search-input").value.toLowerCase();
            const dept = document.getElementById("filter-dept").value;
            const tbody = document.getElementById("employee-table-body");

            const filtered = allUsers.filter(u => {
                const matchesQuery = u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q);
                const matchesDept = dept ? u.department === dept : true;
                return matchesQuery && matchesDept;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">No employees found.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(u => `
        <tr>
          <td><strong>${u.name}</strong></td>
          <td>${u.email}</td>
          <td>${u.department || 'General'}</td>
          <td>$${Number(u.salary || 0).toLocaleString()}</td>
          <td><span class="badge ${u.role === 'admin' ? 'badge-late' : 'badge-present'}">${u.role}</span></td>
          <td>
            <button class="btn btn-secondary btn-sm" onclick="editUser(${u.id})">Edit</button>
            ${u.role !== 'admin' ? `<button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">Delete</button>` : ''}
          </td>
        </tr>
      `).join("");
        }

        document.getElementById("search-input").addEventListener("input", renderTable);
        document.getElementById("filter-dept").addEventListener("change", renderTable);

        function openModal() {
            document.getElementById("employee-form").reset();
            document.getElementById("emp-id").value = "";
            document.getElementById("modal-title").innerText = "Add New Employee";
            document.getElementById("err-emp-email").innerText = "";
            document.getElementById("err-emp-salary").innerText = "";
            document.getElementById("employee-modal").classList.add("active");
        }

        function closeModal() {
            document.getElementById("employee-modal").classList.remove("active");
        }

        function editUser(id) {
            const user = allUsers.find(u => u.id === id);
            if (!user) return;
            document.getElementById("emp-id").value = user.id;
            document.getElementById("emp-name").value = user.name;
            document.getElementById("emp-email").value = user.email;
            document.getElementById("emp-password").value = user.password;
            document.getElementById("emp-dept").value = user.department || "Engineering";
            document.getElementById("emp-salary").value = user.salary || 0;
            document.getElementById("modal-title").innerText = "Edit Employee";
            document.getElementById("employee-modal").classList.add("active");
        }

        function deleteUser(id) {
            if (!confirm("Are you sure you want to remove this employee?")) return;
            allUsers = allUsers.filter(u => u.id !== id);
            Storage.set(STORAGE_KEYS.USERS, allUsers);
            renderTable();
        }

        document.getElementById("employee-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const id = document.getElementById("emp-id").value;
            const name = document.getElementById("emp-name").value.trim();
            const email = document.getElementById("emp-email").value.trim().toLowerCase();
            const password = document.getElementById("emp-password").value;
            const department = document.getElementById("emp-dept").value;
            const salary = parseFloat(document.getElementById("emp-salary").value);

            // Validation
            const errEmail = document.getElementById("err-emp-email");
            const errSalary = document.getElementById("err-emp-salary");
            errEmail.innerText = "";
            errSalary.innerText = "";

            const duplicate = allUsers.find(u => u.email.toLowerCase() === email && String(u.id) !== String(id));
            if (duplicate) {
                errEmail.innerText = "Email is already taken by another account.";
                return;
            }
            if (salary <= 0) {
                errSalary.innerText = "Salary must be greater than zero.";
                return;
            }

            if (id) {
                // Update
                const idx = allUsers.findIndex(u => String(u.id) === String(id));
                if (idx !== -1) {
                    allUsers[idx] = { ...allUsers[idx], name, email, password, department, salary };
                }
            } else {
                // Create new
                allUsers.push({
                    id: Date.now(),
                    name,
                    email,
                    password,
                    role: "employee",
                    department,
                    salary
                });
            }

            Storage.set(STORAGE_KEYS.USERS, allUsers);
            closeModal();
            renderTable();
        });

        renderTable();
    </script>
</body>

</html>
