<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCM Lite - Login & Setup</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">

    <div class="card" style="width:100%; max-width:440px; margin:1rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <h2 style="color:var(--primary-dark); font-size: 1.8rem;">HCM Lite</h2>
            <p id="sub-header" style="color:var(--text-muted); font-size: 0.9rem;">Clean Human Capital Management</p>
        </div>

        <!-- FIRST RUN SETUP FORM -->
        <div id="setup-container" style="display: none;">
            <h3
                style="font-size:1.1rem; margin-bottom:1rem; border-bottom:1px solid var(--border); padding-bottom:0.5rem;">
                Initial Company Setup</h3>
            <form id="setup-form">
                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" id="setup-company" class="form-control" placeholder="e.g. Acme Tech Labs"
                        required>
                    <span class="field-error" id="err-setup-company"></span>
                </div>
                <div class="form-group">
                    <label>Admin Full Name</label>
                    <input type="text" id="setup-name" class="form-control" placeholder="Admin Name" required>
                </div>
                <div class="form-group">
                    <label>Admin Email</label>
                    <input type="email" id="setup-email" class="form-control" placeholder="admin@acme.com" required>
                    <span class="field-error" id="err-setup-email"></span>
                </div>
                <div class="form-group">
                    <label>Admin Password</label>
                    <input type="password" id="setup-pass" class="form-control" placeholder="••••••••" minlength="4"
                        required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Create Workspace</button>
            </form>
        </div>

        <!-- REGULAR LOGIN FORM -->
        <div id="login-container" style="display: none;">
            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="user@company.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-pass" class="form-control" placeholder="••••••••" required>
                </div>
                <div id="login-error" class="field-error" style="margin-bottom:0.8rem; font-size:0.85rem;"></div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
            </form>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const company = Storage.getCompany();
        const session = Storage.getSession();

        // Route if already logged in
        if (session) {
            window.location.href = session.role === "admin" ? "admin.html" : "employee.html";
        }

        if (!company) {
            // First run setup
            document.getElementById("setup-container").style.display = "block";
            document.getElementById("sub-header").innerText = "First-run setup: Register company & Admin";

            document.getElementById("setup-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const companyName = document.getElementById("setup-company").value.trim();
                const adminName = document.getElementById("setup-name").value.trim();
                const adminEmail = document.getElementById("setup-email").value.trim().toLowerCase();
                const adminPass = document.getElementById("setup-pass").value;

                if (!companyName || !adminName || !adminEmail || !adminPass) return;

                // Save company settings
                Storage.set(STORAGE_KEYS.COMPANY, {
                    name: companyName,
                    officeStart: "09:00",
                    graceMinutes: 15,
                    leaveQuota: 15,
                    workingDays: ["Mon", "Tue", "Wed", "Thu", "Fri"]
                });

                // Save Admin account
                const adminUser = {
                    id: Date.now(),
                    name: adminName,
                    email: adminEmail,
                    password: adminPass,
                    role: "admin",
                    department: "Executive",
                    salary: 100000
                };
                Storage.set(STORAGE_KEYS.USERS, [adminUser]);

                // Auto login
                Auth.login(adminEmail, adminPass);
                window.location.href = "admin.html";
            });
        } else {
            document.getElementById("login-container").style.display = "block";
            document.getElementById("sub-header").innerText = `Sign in to ${company.name}`;

            document.getElementById("login-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const email = document.getElementById("login-email").value;
                const pass = document.getElementById("login-pass").value;
                const res = Auth.login(email, pass);

                if (res.success) {
                    window.location.href = res.role === "admin" ? "admin.html" : "employee.html";
                } else {
                    document.getElementById("login-error").innerText = res.message;
                }
            });
        }
    </script>
</body>

</html>
